name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install install-dev
      # The browser test (make test-browser) needs Chromium and its system libraries.
      - run: make frontend-install && cd frontend && npx playwright install --with-deps chromium
      - run: make ci

  # T-B1-001: build the image and run it as `make up` does, then check the running container:
  # its hardening (deploy/check_container.sh) and what it serves (deploy/smoke.sh).
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: make up
      - run: make up-wait
      - run: make container-check
      - run: make smoke
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
      - if: always()
        run: make down

  # T-B1-002: known vulnerabilities in the Python packages we install, from PyPI's advisory data:
  # the development environment, the container's lock and everything installed in the image.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: make install install-dev
      - run: make audit-python
      - run: make audit-image
