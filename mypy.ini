[mypy]
python_version = 3.11
mypy_path = $MYPY_CONFIG_FILE_DIR/platform/ug_core/src,$MYPY_CONFIG_FILE_DIR/platform/ug_intel/src,$MYPY_CONFIG_FILE_DIR/platform/ug_api/src,$MYPY_CONFIG_FILE_DIR/platform/ug_cli/src,$MYPY_CONFIG_FILE_DIR/domains/water/src
explicit_package_bases = True
namespace_packages = True
disallow_untyped_defs = True
warn_unused_ignores = True
no_implicit_optional = True
exclude = (^|/)freebuff(/|$)
