[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ug-water"
version = "0.0.0"
description = "UtilityGuard Twin water domain plugin: network providers, WNTR solver, faults, measurement, actions."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ug_water = ["py.typed"]
