[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ug-water"
version = "0.0.0"
description = "UtilityGuard Twin water domain plugin: network providers, WNTR solver, faults, measurement, actions."
requires-python = ">=3.11"
dependencies = ["ug-core", "wntr>=1.5,<1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ug_water = ["py.typed", "wntr_api_manifest.json", "network/data/*.json", "solver/data/*.json", "scenarios/presets/*.json"]

[project.entry-points."ug.domains"]
water = "ug_water.adapter:WaterAdapter"
