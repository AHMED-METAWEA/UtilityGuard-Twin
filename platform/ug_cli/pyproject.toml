[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ug-cli"
version = "0.0.0"
description = "UtilityGuard Twin command line (ug): doctor, run, reproduce, eval, import, export."
requires-python = ">=3.11"
dependencies = ["ug-core", "jsonschema>=4.26,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ug_cli = ["py.typed"]

[project.scripts]
ug = "ug_cli.main:main"
