[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ug-cli"
version = "0.0.0"
description = "UtilityGuard Twin command line (ug): doctor, run, reproduce, eval, import, export."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ug_cli = ["py.typed"]
