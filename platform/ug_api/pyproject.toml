[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ug-api"
version = "0.0.0"
description = "UtilityGuard Twin API: REST, WebSocket hub, jobs, reports."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ug_api = ["py.typed"]
