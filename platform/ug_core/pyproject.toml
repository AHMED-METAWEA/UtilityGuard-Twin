[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ug-core"
version = "0.0.0"
description = "UtilityGuard Twin core: entities, time model, scenario engine, evidence kernel (domain-agnostic)."
requires-python = ">=3.11"
# pyarrow and duckdb: the run store (Spec 4.7, 11.2), exact pins approved by the owner (D1).
dependencies = ["numpy>=1.26", "pyyaml>=6.0", "pyarrow==26.0.0", "duckdb==1.5.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ug_core = ["py.typed", "geometry/areas/*.json", "geometry/queries/*.overpassql"]
