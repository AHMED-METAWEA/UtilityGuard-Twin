[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ug-core"
version = "0.0.0"
description = "UtilityGuard Twin core: entities, time model, scenario engine, evidence kernel (domain-agnostic)."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ug_core = ["py.typed"]
